<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pantalla de sala · TECNOVA 2026</title>
<style>
@font-face{font-family:Poppins;font-weight:400;font-display:swap;src:url(assets/fonts/poppins-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Poppins;font-weight:600;font-display:swap;src:url(assets/fonts/poppins-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Poppins;font-weight:700;font-display:swap;src:url(assets/fonts/poppins-latin-700-normal.woff2) format("woff2")}
:root{--bg:#050d1f;--card:#0b1c3a;--cy:#39d6ff;--acc:#ff6a35;--mut:#8fa6c7;--line:#1d3a68}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#10305f 0,var(--bg) 55%);color:#eaf2ff;font:400 16px/1.5 Poppins,"Segoe UI",Arial,sans-serif}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px}
.top img{height:44px;background:#fff;border-radius:12px;padding:6px 14px}
.hide{display:none!important}
.login{max-width:480px;margin:20px auto 40px;padding:0 18px}
.login h1{font-size:28px;text-align:center;margin:6px 0 4px}
.login p{text-align:center;color:var(--mut);margin:0 0 16px}
label{display:block;font-weight:600;margin:14px 0 6px}
select,input{width:100%;font:inherit;color:#fff;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:13px 14px}
.btn{width:100%;margin-top:20px;border:0;border-radius:999px;background:var(--acc);color:#fff;font:700 16px Poppins,Arial,sans-serif;padding:15px;cursor:pointer}
.btn:disabled{opacity:.6}
.err{color:#ff8a7a;font-weight:600;margin-top:12px;text-align:center}
.hd{padding:0 24px}
.hd .k{color:var(--cy);font-weight:600;letter-spacing:.25em;font-size:13px}
.hd h2{margin:2px 0 0;font-size:30px;line-height:1.15}
.hd small{color:var(--mut)}
.main{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:22px;padding:18px 24px 40px;align-items:start}
@media(max-width:820px){.main{grid-template-columns:1fr}}
.qr{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px;text-align:center;position:sticky;top:12px}
.qr .n{display:inline-block;background:var(--acc);border-radius:999px;font-weight:700;padding:2px 14px;margin-bottom:8px}
.qr h3{margin:0 0 12px;font-size:22px;line-height:1.2}
.qr img{width:100%;max-width:340px;border-radius:20px;background:#fff;padding:12px;box-shadow:0 0 50px rgba(57,214,255,.35)}
.qr p{color:var(--mut);font-size:13px;margin:10px 0 0;word-break:break-all}
.ch{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px 18px;margin-bottom:14px}
.ch.now{border-color:var(--cy);box-shadow:0 0 28px rgba(57,214,255,.25)}
.ch .h{color:var(--cy);font-weight:600;font-size:14px;letter-spacing:.06em;display:flex;gap:10px;align-items:center}
.ch .now-tag{background:var(--cy);color:#04223a;border-radius:999px;padding:1px 10px;font-size:11px;font-weight:700}
.ch .t{font-weight:600;font-size:18px;margin:4px 0 12px;line-height:1.3}
.rev{border:0;border-radius:999px;background:var(--acc);color:#fff;font:700 16px Poppins,Arial,sans-serif;padding:12px 22px;cursor:pointer}
.rev.alt{background:transparent;border:2px solid var(--line);color:var(--mut);padding:8px 16px;font-size:14px;margin-top:10px}
.word{font:700 clamp(38px,7vw,72px)/1.05 Poppins,Arial,sans-serif;letter-spacing:.1em;color:#fff;text-shadow:0 0 22px rgba(57,214,255,.85);word-break:break-all;margin:6px 0 0}
.go{display:block;text-align:center;color:var(--mut);font-size:14px;margin-top:6px}
</style>
<style>
#rbdim{position:fixed;inset:0;background:rgba(7,26,51,.62);backdrop-filter:blur(3px);z-index:9000;opacity:0;pointer-events:none;transition:opacity .6s}
#rbdim.on{opacity:1;pointer-events:auto}
#rbv{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);width:min(94vw,1100px);max-height:86vh;object-fit:contain;z-index:9001;opacity:0;pointer-events:none;transition:opacity .8s,transform .8s;
 -webkit-mask-image:radial-gradient(ellipse 62% 62% at 50% 50%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 62% 62% at 50% 50%,#000 55%,transparent 100%)}
#rbv.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#rbskip{position:fixed;right:16px;bottom:16px;z-index:9002;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:6px 14px;font:500 13px sans-serif;cursor:pointer;display:none}
#rbskip.on{display:block}
#rbbtn{position:fixed;right:16px;bottom:16px;z-index:8000;background:linear-gradient(135deg,#0a8fd6,#0b3a73);color:#fff;border:1px solid #fff6;border-radius:30px;padding:12px 20px;font:600 15px sans-serif;cursor:pointer;box-shadow:0 8px 24px #0006}
</style>
</head>
<body>
<div id="rbdim"></div><video id="rbv" src="assets/palabra_robot.mp4" playsinline preload="auto"></video><button id="rbskip" type="button">Saltar</button>
<button id="rbbtn" type="button">&#9654; Mensaje del robot</button>
<script>
(function(){var v=document.getElementById('rbv'),d=document.getElementById('rbdim'),k=document.getElementById('rbskip'),b=document.getElementById('rbbtn');
function fin(){v.classList.remove('on');d.classList.remove('on');k.classList.remove('on');b.style.display='';try{v.pause();}catch(e){}}
b.onclick=function(){b.style.display='none';try{v.currentTime=0;}catch(e){}v.muted=false;v.volume=1;
 var go=function(){v.classList.add('on');d.classList.add('on');k.classList.add('on');};
 var p=v.play();if(p&&p.then)p.then(go).catch(function(){v.muted=true;v.play().then(go).catch(fin);});else go();};
v.onended=fin;k.onclick=fin;})();
</script>


<div class="top"><img src="assets/tecnova-logo.png" alt="TECNOVA 2026"><button class="rev alt hide" id="cambiar" style="margin:0">Cambiar de sala</button></div>

<div class="login" id="login">
  <h1>Pantalla de sala</h1>
  <p>Elija el día y la sala. Luego seleccione la conferencia que va a proyectar.</p>
  <label for="dia">Día</label>
  <select id="dia"><option value="2026-11-11">Miércoles 11 de noviembre</option><option value="2026-11-12">Jueves 12 de noviembre</option><option value="2026-11-13">Viernes 13 de noviembre</option></select>
  <label for="sala">Sala</label>
  <select id="sala"></select>
  <button class="btn" id="abrir">Continuar</button>
  <div class="err" id="err" role="status"></div>
</div>

<div id="elegir" class="login hide" style="max-width:820px">
  <h1 id="elegirtit"></h1>
  <p>Toque el nombre de la conferencia que se va a proyectar.</p>
  <div id="opciones"></div>
</div>

<div id="pantalla" class="hide">
  <div class="hd"><div class="k">TECNOVA 2026 · ASISTENCIA</div><h2 id="titulo"></h2><small id="mod"></small></div>
  <div class="main">
    <div class="qr"><span class="n">1</span><h3>Escanee y registre<br>su asistencia</h3><img src="assets/qr_asistencia.png" alt="QR asistencia"><p>svzapatac.github.io/tecnova-registro/asistencia</p></div>
    <div><div id="lista"></div><button class="rev alt" id="otra" style="margin-top:14px">&larr; Elegir otra conferencia</button></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://lhmsnlglynyscypnjavv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_deVkpWRVb9jbNNjUFzWRdw_1sSXVp7Q';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const DIAS = { '2026-11-11': 'Miércoles 11 de noviembre', '2026-11-12': 'Jueves 12 de noviembre', '2026-11-13': 'Viernes 13 de noviembre' };
const SALAS = {
  '2026-11-11': [['AUDITORIO', 'Auditorio Lectus · conferencias y eventos'], ['P01', 'Gustavo Andrés Romero Duque'], ['P02', 'Adriana López Vargas'], ['P03', 'Héctor Iván Tangarife Escobar'], ['V01', 'Juan Carlos Guevara Bolaños'], ['V02', 'Gloria Andrea Cavanzo Nisso'], ['V03', 'Catalina Suarez Pérez'], ['V04', 'Carlos Duarte Garzón']],
  '2026-11-12': [['AUDITORIO', 'Auditorio Lectus · conferencias y eventos'], ['P01', 'Gustavo Andrés Romero Duque'], ['P02', 'Wilson Alexander Pinzón Rueda'], ['P03', 'Giovanni Sánchez Prieto'], ['V05', 'Juan Carlos Guevara Bolaños'], ['V06', 'Gloria Andrea Cavanzo Nisso'], ['V07', 'Catalina Suarez Pérez'], ['V08', 'Carlos Duarte Garzón']],
  '2026-11-13': [['AUDITORIO', 'Auditorio Lectus · conferencias y eventos']]
};
async function rpc(fn, body) {
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 15000);
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY }, body: JSON.stringify(body), signal: ctl.signal });
    if (!r.ok) throw new Error('http ' + r.status);
    return await r.json();
  } finally { clearTimeout(to); }
}
function salasDelDia() {
  const d = $('dia').value; $('sala').innerHTML = SALAS[d].map(s => '<option value="' + s[0] + '">' + (s[0] === 'AUDITORIO' ? 'Auditorio Lectus' : 'Sala ' + s[0] + (s[0][0] === 'P' ? ' · Presencial' : ' · Virtual') + ' — ' + esc(s[1])) + '</option>').join('');
}
$('dia').addEventListener('change', salasDelDia);
const hoy = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Bogota' });
if (SALAS[hoy]) $('dia').value = hoy;
salasDelDia();
try { const s = JSON.parse(localStorage.getItem('tn_sala_pant') || 'null'); if (s && SALAS[s.dia]) { $('dia').value = s.dia; salasDelDia(); $('sala').value = s.sala; } } catch (e) {}

let ACT = [], SEL = null;
$('opciones').addEventListener('click', e => { const c = e.target.closest('[data-s]'); if (c) proyectar(+c.dataset.s); });
function proyectar(i) {
  SEL = i; const a = ACT[i], dia = $('dia').value, sala = $('sala').value;
  $('titulo').textContent = (sala === 'AUDITORIO' ? 'Auditorio Lectus' : 'Sala ' + sala) + ' · ' + DIAS[dia]; $('mod').textContent = a.desde + ' – ' + a.hasta;
  $('lista').innerHTML = '<div class="ch now"><div class="h">' + esc(a.desde) + ' – ' + esc(a.hasta) + ' <span class="now-tag">PROYECTANDO</span></div><div class="t">' + esc(a.titulo) + '</div><div id="w0"><button class="rev" id="rev0">Revelar palabra sorpresa</button></div></div>';
  $('elegir').classList.add('hide'); $('pantalla').classList.remove('hide');
}
async function revelar() {
  const box = $('w0'), a = ACT[SEL]; box.innerHTML = '<div class="go">Un momento…</div>';
  try {
    const r = await rpc('sala_palabra', { p_id: a.id });
    if (!r || !r.ok) { box.innerHTML = '<div class="go">No se pudo obtener la palabra. Intente de nuevo.</div><button class="rev" id="rev0">Intentar de nuevo</button>'; return; }
    const p = r.palabra;
    box.innerHTML = '<div class="word" id="ww0"></div><div class="go">Escríbala en el formulario de asistencia</div><button class="rev alt" id="ocu0">Ocultar</button>';
    const el = $('ww0'), ch = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&'; let n = 0;
    const id = setInterval(() => { n++; el.textContent = p.split('').map((c, k) => k < n / 2 ? c : ch[Math.floor(Math.random() * ch.length)]).join(''); if (n >= p.length * 2) { clearInterval(id); el.textContent = p; } }, 55);
  } catch (x) { box.innerHTML = '<div class="go">Sin conexión.</div><button class="rev" id="rev0">Intentar de nuevo</button>'; }
}
$('lista').addEventListener('click', e => {
  if (e.target.closest('#rev0')) revelar();
  if (e.target.closest('#ocu0')) $('w0').innerHTML = '<button class="rev" id="rev0">Revelar palabra sorpresa</button>';
});
$('otra').addEventListener('click', () => { $('pantalla').classList.add('hide'); $('elegir').classList.remove('hide'); });
$('abrir').addEventListener('click', async () => {
  const b = $('abrir'), e = $('err'); e.textContent = '';
  const dia = $('dia').value, sala = $('sala').value;
  b.disabled = true; b.textContent = 'Cargando…';
  try {
    const r = await rpc('sala_lista', { p_dia: dia, p_sala: sala });
    ACT = (r && r.actividades) || []; try { localStorage.setItem('tn_sala_pant', JSON.stringify({ dia, sala })); } catch (x) {}
    $('elegirtit').textContent = (sala === 'AUDITORIO' ? 'Auditorio Lectus' : 'Sala ' + sala) + ' · ' + DIAS[dia];
    const ahora = horaBogota(), esHoy = dia === new Date().toLocaleDateString('en-CA', { timeZone: 'America/Bogota' });
    $('opciones').innerHTML = ACT.length ? ACT.map((a, i) => { const now = esHoy && ahora >= a.desde && ahora < a.hasta; return '<div class="ch' + (now ? ' now' : '') + '" data-s="' + i + '" style="cursor:pointer"><div class="h">' + esc(a.desde) + ' – ' + esc(a.hasta) + (now ? ' <span class="now-tag">EN CURSO</span>' : '') + '</div><div class="t">' + esc(a.titulo) + '</div></div>'; }).join('') : '<div class="ch"><div class="t">No hay conferencias programadas en esta sala para este día.</div></div>';
    $('login').classList.add('hide'); $('elegir').classList.remove('hide'); $('cambiar').classList.remove('hide');
  } catch (x) { e.textContent = 'Sin conexión. Intente de nuevo.'; }
  finally { b.disabled = false; b.textContent = 'Continuar'; }
});
function horaBogota() { return new Date().toLocaleTimeString('en-GB', { timeZone: 'America/Bogota', hour: '2-digit', minute: '2-digit' }); }
$('cambiar').addEventListener('click', () => location.reload());
</script>
</body>
</html>
