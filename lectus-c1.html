<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistencia · Conferencia 1 · TECNOVA 2026</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:Poppins;font-weight:400;font-display:swap;src:url(assets/fonts/poppins-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Poppins;font-weight:500;font-display:swap;src:url(assets/fonts/poppins-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Poppins;font-weight:600;font-display:swap;src:url(assets/fonts/poppins-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Poppins;font-weight:700;font-display:swap;src:url(assets/fonts/poppins-latin-700-normal.woff2) format("woff2")}
:root{--ink:#102542;--navy:#0f2b54;--navy2:#0a1f40;--blue:#17407a;--acc:#E75B2F;--mut:#55657a;--line:#c9d3df;--soft:#eef2f7;--ok:#14804a;--err:#b3261e;--gold:#f2b705}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--soft);color:var(--ink);font:400 15px/1.55 Poppins,"Segoe UI",Arial,sans-serif;min-height:100vh}
.top{border-bottom:2px solid var(--navy);background:#fff}
.top .in{max-width:620px;margin:0 auto;padding:10px 18px;display:flex;justify-content:space-between;align-items:center}
.top img.t{height:50px;width:auto;display:block}.top img.r{height:46px;width:auto;display:block}
.hero{background:linear-gradient(120deg,var(--navy2),var(--blue));color:#fff}
.hero .in{max-width:620px;margin:0 auto;padding:22px 18px 26px}
.hero small{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#ffb899;font-weight:600}
.hero h1{margin:4px 0 6px;font-size:25px;line-height:1.2;font-weight:700}
.hero p{margin:0;font-size:13.5px;color:#d5e0f1}
.clock{display:inline-flex;gap:8px;align-items:center;margin-top:12px;padding:5px 14px;border-radius:20px;background:rgba(255,255,255,.14);font-size:13px;font-weight:500}
.clock i{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 3px rgba(61,220,132,.25)}
main{max-width:620px;margin:-14px auto 40px;padding:0 14px}
.card{background:#fff;border:1px solid var(--line);border-top:4px solid var(--acc);border-radius:8px;padding:22px 20px 24px;box-shadow:0 6px 22px rgba(15,43,84,.08)}
.step{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.step em{font-style:normal;font-weight:700;font-size:13px;color:var(--acc);letter-spacing:.06em}
.step h2{margin:0;font-size:13.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--navy)}
.step+*{}
.sp{height:20px}
label{display:block;font-weight:500;font-size:13px;color:var(--navy);margin:12px 0 5px}
input,select{width:100%;min-height:50px;padding:10px 13px;border:1.5px solid #b6c2d1;border-radius:6px;font:400 16px Poppins,Arial,sans-serif;color:var(--ink);background:#fff}
select{padding-right:8px}
input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,64,122,.16)}
.hint{font-size:12.5px;color:var(--mut);margin-top:6px}
.empty{padding:14px 16px;background:#fff7f2;border-left:4px solid var(--acc);border-radius:0 6px 6px 0;font-size:13.5px;color:var(--navy)}
.empty b{display:block;margin-bottom:2px}
.key{position:relative}
.key:before{content:"🔑";position:absolute;left:13px;top:13px;font-size:18px;z-index:1}
.key input{padding-left:44px;font-weight:600;letter-spacing:.02em}
.btn{width:100%;margin-top:18px;min-height:54px;border:0;border-radius:6px;background:var(--acc);color:#fff;font:600 16px Poppins,Arial,sans-serif;cursor:pointer;box-shadow:0 4px 12px rgba(231,91,47,.3)}
.btn:disabled{opacity:.6;cursor:progress}
.link{all:unset;display:block;margin:14px auto 0;text-align:center;color:var(--blue);font-weight:600;font-size:13.5px;text-decoration:underline;cursor:pointer}
.msg{display:none;margin-top:14px;padding:11px 14px;border-radius:6px;font-size:13.5px}
.msg.on{display:block}.msg.err{background:#fdecea;color:var(--err);border-left:4px solid var(--err)}
.msg a{color:inherit;font-weight:600}
.res{display:none;margin-top:18px}.res.on{display:block}
.ok{text-align:center;padding:6px 0 4px}
.mark{width:68px;height:68px;border-radius:50%;background:var(--ok);color:#fff;font-size:36px;line-height:68px;margin:0 auto 10px;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.ok h3{margin:0 0 4px;font-size:20px;color:var(--navy)}
.ok p{margin:0;font-size:13.5px;color:var(--mut)}
.ok .t{margin-top:8px;font-weight:600;color:var(--ink);font-size:14px}
.won{margin-top:16px;padding:14px 16px;border-radius:8px;background:linear-gradient(120deg,#fff4cc,#ffe08a);border:1.5px solid var(--gold);color:#5a4300;font-size:14px;text-align:center;animation:pop .6s}
.won b{display:block;font-size:16px;color:#3d2e00}
.prog{margin-top:18px}
.prog h4{margin:0 0 8px;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--navy)}
.pr{margin-bottom:12px}
.pr .n{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:500;color:var(--navy)}
.pr .n span:last-child{font-weight:700;white-space:nowrap}
.bar{height:10px;border-radius:6px;background:#e3e9f1;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue),#2c7be5);transition:width .8s}
.pr.done .bar i{background:linear-gradient(90deg,#14804a,#3ddc84)}
.pr.done .n span:last-child{color:var(--ok)}
.sum{font-size:12.5px;color:var(--mut);margin-top:10px;text-align:center}
.foot{text-align:center;font-size:12px;color:var(--mut);margin:18px 10px 0}
.foot a{color:var(--blue)}
</style>
</head>
<body>
<div class="top"><div class="in">
  <img class="t" src="assets/tecnova-logo.png" alt="TECNOVA 2026">
  <img class="r" src="assets/logos/01_tecred.png" alt="TEC-RED">
</div></div>

<section class="hero"><div class="in">
  <small>TECNOVA 2026 · Auditorio Lectus</small>
  <h1>Asistencia a la conferencia</h1>
  <p>Conferencia 1 · Miércoles 11 de noviembre · 9:00 a. m.</p>
</div></section>

<main>
<form class="card" id="f" novalidate autocomplete="on">
  <div class="step"><em>01</em><h2>Sus datos</h2></div>
  <label for="doc">Número de documento</label>
  <input id="doc" inputmode="numeric" autocomplete="off" maxlength="20" placeholder="Sin puntos ni espacios">
  <label for="nombre">Nombre completo</label>
  <input id="nombre" autocomplete="name" maxlength="120" placeholder="Nombres y apellidos">
  <label for="correo">Correo electrónico</label>
  <input id="correo" type="email" inputmode="email" autocapitalize="none" spellcheck="false" autocomplete="email" maxlength="120" placeholder="nombre@correo.com">
  <div class="msg err" id="err" role="alert"></div>
  <button class="btn" id="go" type="submit">Confirmar mi asistencia</button>
  <div class="res" id="res" aria-live="polite"></div>
</form>
<p class="foot">Dudas: tecred@usbbog.edu.co</p>
</main>
<script>
const C = 'C1';
const $ = id => document.getElementById(id);
async function rpc(fn, body) { const r = await fetch('https://lhmsnlglynyscypnjavv.supabase.co/rest/v1/rpc/' + fn, { method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': 'sb_publishable_deVkpWRVb9jbNNjUFzWRdw_1sSXVp7Q' }, body: JSON.stringify(body) }); if (!r.ok) throw new Error('http ' + r.status); return r.json(); }
function setErr(m) { const e = $('err'); e.textContent = m || ''; e.classList.toggle('on', !!m); }
$('f').addEventListener('submit', async ev => {
  ev.preventDefault(); setErr('');
  const doc = $('doc').value.replace(/[^0-9A-Za-z]/g, ''), nombre = $('nombre').value.trim().replace(/\s+/g, ' '), correo = $('correo').value.trim().toLowerCase();
  if (doc.length < 5) return setErr('Escriba su número de documento.');
  if (nombre.split(' ').length < 2) return setErr('Escriba su nombre y apellido.');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(correo)) return setErr('Escriba un correo válido.');
  $('go').disabled = true;
  try {
    const r = await rpc('lectus_registrar', { p_c: C, p_documento: doc, p_nombre: nombre, p_correo: correo });
    if (!r.ok) throw new Error('x');
    $('f').querySelectorAll('label,input,.btn').forEach(x => x.style.display = 'none');
    $('res').classList.add('on'); $('res').innerHTML = '<div class="ok"><div class="mark">✓</div><h3>¡Asistencia registrada!</h3><p>Gracias, ' + nombre.split(' ')[0].replace(/[<>&]/g, '') + '. Quedó confirmada su asistencia a la conferencia.</p></div>';
  } catch (e) { setErr('No se pudo registrar. Intente de nuevo.'); $('go').disabled = false; }
});
</script>
</body></html>
